spring:
  application:
    name: api-gateway
  config:
    import:
      - classpath:routes/routes.yaml
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL}
  instance:
    prefer-ip-address: true

server:
  port: 8080