spring:
  cloud:
    gateway:
      routes:
        - id: driver-service
          uri: lb://driver-service
          predicates:
            - Path=/api/v1/drivers/**
            - Path=/api/v1/drivers
            - Path=/api/v1/rates/**

        - id: finance-service
          uri: lb://finance-service
          predicates:
            - Path=/api/v1/finance/**

        - id: passenger-service
          uri: lb://passenger-service
          predicates:
            - Path=/api/v1/passengers/**
            - Path=/api/v1/passengers
            - Path=/api/v1/rates/**

        - id: ride-service
          uri: lb://ride-service
          predicates:
            - Path=/api/v1/fares
            - Path=/api/v1/fares/**
            - Path=/api/v1/promo-codes
            - Path=/api/v1/promo-codes/**
            - Path=/api/v1/rides
            - Path=/api/v1/rides/**