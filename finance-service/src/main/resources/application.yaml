spring:
  application:
    name: finance-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
  liquibase:
    enabled: true
  artemis:
    broker-url: ${SPRING_ARTEMIS_BROKER_URL}
    user: ${SPRING_ARTEMIS_USER}
    password: ${SPRING_ARTEMIS_PASSWORD}
  messages:
    basename: messages
    encoding: UTF-8
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL}
management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
    tags:
      service: finance-service
  elastic:
    metrics:
      export:
        enabled: true
        host: ${ES_URL}
        index: finance-metrics
        auto-create-index: false
        timestamp-field-name: "@timestamp"
        step: 1m
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT}
server:
  port: 8084