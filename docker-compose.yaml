services:
  # =============== Базы данных ===============
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:${DB_PORT}"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27018:${MONGO_PORT}"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  zookeeper:
    image: docker.io/bitnami/zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:${ZOOKEEPER_PORT}"
    environment:
      BITNAMI_DEBUG: "false"
      ALLOW_ANONYMOUS_LOGIN: "yes"
    volumes:
      - zookeeper_data:/bitnami
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_CONTROLLER_QUORUM: zookeeper:2181
    volumes:
      - kafka_data:/bitnami/kafka
    restart: unless-stopped

  artemis:
    image: vromero/activemq-artemis:latest
    container_name: artemis
    ports:
      - "${ARTEMIS_PORT}:61616"
    environment:
      ARTEMIS_USERNAME: ${ARTEMIS_USER}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
    restart: unless-stopped

  # =============== Микросервисы ===============
  driver-service:
    build:
      context: ./driver-service
    container_name: driver-service
    ports:
      - "8082:${DRIVER_SERVER_PORT}"
    depends_on:
      - mysql
      - kafka
      - artemis
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_FINANCE_SERVICE_URL: http://finance-service:8084/api/v1/finance
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_PASSENGER_SERVICE_URL: http://passenger-service:8081/api/v1/rates
      SERVER_PORT: 8082

  finance-service:
    build:
      context: ./finance-service
    container_name: finance-service
    ports:
      - "8084:${FINANCE_SERVER_PORT}"
    depends_on:
      - mysql
      - artemis
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${FINANCE_DB_NAME}?useUnicode=true&characterEncoding=utf8
      SPRING_ARTEMIS_BROKER_URL: tcp://artemis:61616
      SERVER_PORT: 8084

  passenger-service:
    build:
      context: ./passenger-service
    container_name: passenger-service
    ports:
      - "8081:${PASSENGER_SERVER_PORT}"
    depends_on:
      - mysql
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${PASSENGER_DB_NAME}?useSSL=false&serverTimezone=UTC
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DRIVER_SERVICE_URL: http://driver-service:8082/api/v1/drivers
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_RIDE_SERVICE_URL: http://ride-service:8083/api/v1/rides
      SERVER_PORT: 8081

  ride-service:
    build:
      context: ./ride-service
    container_name: ride-service
    ports:
      - "8083:${RIDE_SERVER_PORT}"
    depends_on:
      - mongodb
      - kafka
    env_file:
      - .env
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB_NAME}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_FINANCE_SERVICE_URL: http://finance-service:8084/api/v1/finance
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_PASSENGER_SERVICE_URL: http://passenger-service:8081/api/v1/passengers
      SERVER_PORT: 8083
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

volumes:
  mysql_data:
  kafka_data:
  mongo_data:
  zookeeper_data: