services:
  # =============== База данных ===============
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${DRIVER_DATABASE}
    ports:
      - "3307:${DB_PORT}"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27018:${MONGO_PORT}"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  zookeeper:
    image: docker.io/bitnami/zookeeper:latest
    container_name: zookeeper
    ports:
      - "${ZOOKEEPER_PORT}:2181"
    environment:
      BITNAMI_DEBUG: "false"
      ALLOW_ANONYMOUS_LOGIN: "yes"
    volumes:
      - zookeeper_data:/bitnami
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_CONTROLLER_QUORUM: zookeeper:2181
    volumes:
      - kafka_data:/bitnami/kafka
    restart: unless-stopped

  artemis:
    image: vromero/activemq-artemis:latest
    container_name: artemis
    ports:
      - "${ARTEMIS_PORT}:61616"
    environment:
      ARTEMIS_USERNAME: ${ARTEMIS_USER}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
    restart: unless-stopped

  # =============== Микросервисы ===============
  driver-service:
    build:
      context: ./driver-service
    container_name: driver-service
    ports:
      - "${DRIVER_SERVER_PORT}:${DRIVER_SERVER_PORT}"
    depends_on:
      - mysql
      - kafka
      - artemis
    env_file:
      - .env
    volumes:
      - ${LIQUIBASE_DRIVER_PATH}
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DRIVER_DATABASE}?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DRIVER_SERVICE_URL: ${DRIVER_SERVICE_URL}
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_FINANCE_SERVICE_URL: ${FINANCE_SERVICE_URL}
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_PASSENGER_SERVICE_URL: ${PASSENGER_SERVICE_URL}
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_RIDE_SERVICE_URL: ${RIDE_SERVICE_URL}
      SERVER_PORT: ${DRIVER_SERVER_PORT}

  passenger-service:
    build:
      context: ./passenger-service
    container_name: passenger-service
    ports:
      - "${PASSENGER_SERVER_PORT}:${PASSENGER_SERVER_PORT}"
    depends_on:
      - mysql
    env_file:
      - .env
    volumes:
      - ${LIQUIBASE_PASSENGER_PATH}
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${PASSENGER_DATABASE}?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DRIVER_SERVICE_URL: ${DRIVER_SERVICE_URL}
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_RIDE_SERVICE_URL: ${RIDE_SERVICE_URL}
      SERVER_PORT: ${PASSENGER_SERVER_PORT}

  finance-service:
    build:
      context: ./finance-service
    container_name: finance-service
    ports:
      - "${FINANCE_SERVER_PORT}:${FINANCE_SERVER_PORT}"
    depends_on:
      - mysql
      - artemis
    env_file:
      - .env
    volumes:
      - ${LIQUIBASE_FINANCE_PATH}
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${FINANCE_DATABASE}?useUnicode=true&characterEncoding=utf8
      SPRING_ARTEMIS_BROKER_URL: tcp://artemis:61616
      SERVER_PORT: ${FINANCE_SERVER_PORT}

  ride-service:
    build:
      context: ./ride-service
    container_name: ride-service
    ports:
      - "${RIDE_SERVER_PORT}:${RIDE_SERVER_PORT}"
    depends_on:
      - mongodb
      - kafka
    env_file:
      - .env
    volumes:
      - ${LIQUIBASE_RIDE_PATH}
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB_NAME}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_FINANCE_SERVICE_URL: ${FINANCE_SERVICE_URL}
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_PASSENGER_SERVICE_URL: ${PASSENGER_SERVICE_URL}
      SERVER_PORT: ${RIDE_SERVER_PORT}
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

volumes:
  mysql_data:
  kafka_data:
  mongo_data:
  zookeeper_data: